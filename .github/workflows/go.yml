name: Go

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Informativo: el repo tiene ejercicios con TODO a propósito,
      # el lint no debe bloquear build/test.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
        continue-on-error: true
